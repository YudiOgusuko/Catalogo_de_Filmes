<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes e Séries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head

<body>
    <div class="barra" id="barra" aria-hidden="true"></div>

    <div class="app">
        <aside class="lateral">
            <a href="#" class="marca" id="marca">Catálogo de Filmes e Séries</a>

            <form id="form-busca" autocomplete="off">
                <label class="pesquisa">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
                    <input type="search" id="texto" placeholder="Pesquisar" aria-label="Pesquisar">
                </label>

                <label class="pesquisa-por">
                    <span>Pesquisar por</span>
                    <select id="modo">
                        <option value="buscar">Título específico</option>
                        <option value="tituloIgual">Todos com esse título</option>
                        <option value="ator">Ator ou atriz</option>
                    </select>
                </label>

                <nav class="menu">
                    <button type="button" class="menu__item ativo" data-nav="home">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>Home
                    </button>
                    <button type="button" class="menu__item" data-nav="serie">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M8 21h8M12 17v4" /></svg>Séries
                    </button>
                    <button type="button" class="menu__item" data-nav="filme">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4" /></svg>Filmes
                    </button>

                    <button type="button" class="menu__item" data-nav="categoria" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>Categoria
                    </button>
                    <div class="menu__sub" hidden>
                        <select id="genero" aria-label="Categoria">
                            <option value="">Selecione uma categoria</option>
                        </select>
                    </div>

                    <button type="button" class="menu__item" data-nav="filtro" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z" /></svg>Filtro
                    </button>
                    <div class="menu__sub" hidden>
                        <select id="filtro" aria-label="Filtro">
                            <option value="">Sem filtro</option>
                            <option value="top5">Top 5 melhores avaliados</option>
                            <option value="top5Eps">Top 5 episódios de uma série</option>
                            <option value="anoMin">Ano a partir de</option>
                            <option value="anoMax">Ano até</option>
                            <option value="avalMin">Avaliação mínima</option>
                            <option value="avalMax">Avaliação máxima</option>
                            <option value="tempMin">Mínimo de temporadas (séries)</option>
                            <option value="tempMax">Máximo de temporadas (séries)</option>
                        </select>
                        <input type="text" id="nome-serie" maxlength="74" placeholder="Nome da série" aria-label="Nome da série" hidden>
                        <label id="campo-valor" hidden>
                            <input type="number" id="valor" step="any" min="0" aria-label="Valor do filtro">
                        </label>
                        <p class="menu__dica">Aplique com Buscar Filme ou Buscar Série.</p>
                    </div>
                </nav>

                <div class="busca__botoes">
                    <button type="button" class="btn" data-tipo="filme">Buscar Filme</button>
                    <button type="button" class="btn" data-tipo="serie">Buscar Série</button>
                    <p class="menu__dica">Vale o filtro, depois a pesquisa e por fim a categoria.</p>
                </div>
            </form>

            <details class="gerenciar">
                <summary>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" /></svg>Gerenciar catálogo
                </summary>
                <div class="gerenciar__painel">
                    <h2>Filmes</h2>
                    <button data-acao="adicionar" data-tipo="filme">Adicionar filme</button>
                    <button data-acao="deletar" data-tipo="filme">Deletar filme</button>
                    <button data-acao="todos" data-tipo="filme">Ver todos os filmes</button>
                    <button data-acao="deletarTodos" data-tipo="filme" class="perigo">Deletar todos os filmes</button>
                    <h2>Séries</h2>
                    <button data-acao="adicionar" data-tipo="serie">Adicionar série</button>
                    <button data-acao="deletar" data-tipo="serie">Deletar série</button>
                    <button data-acao="todos" data-tipo="serie">Ver todas as séries</button>
                    <button data-acao="deletarTodos" data-tipo="serie" class="perigo">Deletar todas as séries</button>
                </div>
            </details>
        </aside>

        <main>
            <section class="secao" id="sec-filme" hidden>
                <h2 class="secao__titulo"></h2>
                <div class="grade"></div>
            </section>

            <section class="secao" id="sec-serie" hidden>
                <h2 class="secao__titulo"></h2>
                <div class="grade"></div>
            </section>
        </main>
    </div>

    <!-- Detalhes de filme e série -->
    <dialog id="modal">
        <button class="fechar" aria-label="Fechar">×</button>
        <div class="modal__conteudo" id="modal-corpo"></div>
    </dialog>

    <!-- Pergunta o nome para adicionar/deletar -->
    <dialog id="dlg-nome" class="dlg-nome">
        <form method="dialog">
            <h2 id="dlg-titulo"></h2>
            <input type="text" id="dlg-input" required maxlength="74" placeholder="Digite o título">
            <div class="dlg-nome__acoes">
                <button type="submit" value="ok" class="btn">Confirmar</button>
                <button type="submit" value="cancelar" class="btn btn--suave" formnovalidate>Cancelar</button>
            </div>
        </form>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
